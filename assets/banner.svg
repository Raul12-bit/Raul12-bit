<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Raul Ni — software engineer, applied AI, robotics. Kazakhstan.">
  <defs>
    <pattern id="board" width="44" height="44" patternUnits="userSpaceOnUse" x="772" y="38">
      <rect width="22" height="22" fill="#1c1c21"/>
      <rect x="22" y="22" width="22" height="22" fill="#1c1c21"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="boardMask">
      <rect x="772" y="38" width="352" height="176" fill="url(#fade)"/>
    </mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="#0c0c0e" stroke="#202026"/>

  <!-- chessboard fading in from the left, with a highlighted last move (e2 -> e4 style) -->
  <g mask="url(#boardMask)">
    <rect x="772" y="38" width="352" height="176" fill="url(#board)"/>
    <rect x="1036" y="148" width="22" height="22" fill="#ff5a36" fill-opacity="0.28"/>
    <rect x="1036" y="104" width="22" height="22" fill="#ff5a36" fill-opacity="0.5"/>
  </g>

  <!-- circuit trace from the name to the board -->
  <g fill="none" stroke="#2c2c33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 262 H520 L548 234 H700 L728 206 H772"/>
    <path d="M590 262 H740 L760 242 H860"/>
  </g>
  <g fill="#0c0c0e" stroke="#3a3a42" stroke-width="2">
    <circle cx="520" cy="262" r="4"/>
    <circle cx="700" cy="234" r="4"/>
    <circle cx="860" cy="242" r="4"/>
  </g>
  <circle cx="772" cy="206" r="4" fill="#ff5a36"/>

  <!-- orbit and satellite -->
  <g transform="rotate(-16 1000 132)">
    <ellipse cx="1000" cy="132" rx="190" ry="54" fill="none" stroke="#ff5a36" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
    <circle cx="1176" cy="152" r="14" fill="url(#glow)"/>
    <circle cx="1176" cy="152" r="3.5" fill="#ffd2c4"/>
  </g>

  <!-- text -->
  <text x="62" y="138" fill="#f2f0eb" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="600" letter-spacing="-2">Raul Ni</text>
  <text x="66" y="186" fill="#8b8b94" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="0.5">software engineer · applied AI · robotics</text>
  <circle cx="72" cy="219" r="4" fill="#ff5a36"/>
  <text x="86" y="225" fill="#c9c7c0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17">Kazakhstan</text>
</svg>
